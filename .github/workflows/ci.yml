# Continuous integration: every push and pull request is type-checked, unit-tested and built.
# The build prerenders the catalog, so it runs against a throwaway Postgres seeded from content/catalog.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skillflow
          POSTGRES_PASSWORD: skillflow
          POSTGRES_DB: skillflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U skillflow -d skillflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway values for CI only. No real secret is used or needed here.
      DATABASE_URL: postgresql://skillflow:skillflow@localhost:5432/skillflow
      AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters-long
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # Next.js generates route types (PageProps, LayoutProps) into .next/types; a fresh machine has none yet.
      - name: Generate Next.js route types
        run: npx next typegen

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Create the database schema
        run: npx prisma migrate deploy

      - name: Seed the catalog
        run: npx prisma db seed

      - name: Production build
        run: npm run build
        env:
          GIT_SHA: ${{ github.sha }}
