# Production stack: app + Postgres + Redis + Caddy (HTTPS), all on one EC2 instance.
# Run on the server from the repo folder. Settings come from .env (never committed).

services:
  app:
    build:
      context: .
      network: host            # the build pre-renders the catalog, so it must reach Postgres
      secrets: [buildenv]      # .env.build is mounted only during the build, never stored
    image: skillflow:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - uploads:/app/public/uploads   # learner uploads survive rebuilds
    expose: ["3000"]                  # reachable only inside Docker; Caddy is the front door

  postgres:
    image: pgvector/pgvector:pg16-trixie   # Postgres 16 plus pgvector; the pgdata volume is reused unchanged
    restart: unless-stopped
    environment:
      POSTGRES_USER: skillflow
      POSTGRES_DB: skillflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"         # localhost only (for the build); never public
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillflow -d skillflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  # One-off: builds the SkillFlow Assistant's retrieval index. Never started by `up`; run it with
  #   docker compose --profile tools run --rm assistant-index
  assistant-index:
    build:
      context: .
      target: tools
    image: skillflow-tools:latest
    profiles: ["tools"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data              # HTTPS certificates live here
      - caddy_config:/config
    depends_on: [app]

secrets:
  buildenv:
    file: ./.env.build

volumes:
  pgdata:
  redisdata:
  uploads:
  caddy_data:
  caddy_config: